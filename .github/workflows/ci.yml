name: MSBot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Flake8 (Syntax & Fatal Errors)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,__pycache__

      - name: Run Pytest Test Suite
        env:
          BOT_TOKEN: "1234567890:AAFakeTokenForTestingContinuousIntegration00"
          SUPER_ADMIN_ID: "1685356708"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          WEB_APP_URL: "http://localhost:8000"
        run: |
          pytest tests/ -v
